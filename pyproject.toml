[project]
name = "sound"
version = "0.1.0"
description = "Linux audio tools: vocal pitch correction and more"
authors = [
    { name = "SB869", email = "sethblakley869@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pyloudnorm>=0.2.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sound = "sound.cli:main"
autotune = "sound.cli:autotune_main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
